name: "Puppet"
description: "Turn dashboards into nice pictures"
version: "2.5.0"
slug: "puppet"
homeassistant_api: true
init: false
arch:
  - aarch64
  - amd64
ports:
  10000/tcp: 10000
webui: "[PROTO:ssl]://[HOST]:[PORT:10000]/"
map:
  - type: ssl
options:
  access_token: ""
  keep_browser_open: false
  home_assistant_url: "http://homeassistant:8123"
  allow_insecure_home_assistant_ssl: false
  trusted_root_ca_file: ""
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
schema:
  access_token: str
  keep_browser_open: bool
  home_assistant_url: str
  allow_insecure_home_assistant_ssl: bool
  trusted_root_ca_file: str
  ssl: bool
  certfile: str
  keyfile: str
